<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم وقت الدراسة</title>

  <!-- استدعاء مكتبات Firebase السحابية -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // مفاتيح مشروعك الخاصة بـ Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyC7biYFwpFo04asez0TOgPXtgghvF87",
      authDomain: "study-planner-87613.firebaseapp.com",
      projectId: "study-planner-87613",
      storageBucket: "study-planner-87613.firebasestorage.app",
      messagingSenderId: "398426757170",
      appId: "1:398426757170:web:3cfeec488e4f7020f1c42b",
      measurementId: "G-NNZ0X983LS"
    };

    // تهيئة تطبيق Firebase وخدمة قاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // جعل الدوال والسجلات متاحة في النافذة العامة (Global Scope)
    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
  </script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e2d;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    input, button, select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a3c;
      color: white;
      margin-top: 5px;
    }
    button {
      cursor: pointer;
      background: #007bff;
      border: none;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="text-align: center;">📅 منظم وقت الدراسة</h2>

    <!-- قسم تسجيل الدخول / اسم المستخدم -->
    <div class="card">
      <label>أدخل اسم المستخدم للتحميل والحفظ السحابي:</label><br>
      <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا..." style="width: 70%;">
      <button onclick="loginUser()">دخول</button>
      <p id="userStatus" style="font-size: 13px; color: #aaa; margin-top: 8px;"></p>
    </div>

    <!-- قسم إضافة مهمة دراسية -->
    <div class="card">
      <h3>➕ إضافة مهمة دراسية</h3>
      <input type="text" id="taskSubject" placeholder="المادة أو المهمة" style="width: 100%;"><br><br>
      <input type="date" id="taskDate" style="width: 100%;"><br><br>
      <button onclick="addTask()" style="width: 100%; background: #28a745;">إضافة المهمة</button>
    </div>

    <!-- قائمة المهام -->
    <div class="card">
      <h3>📝 مهام الدراسة</h3>
      <ul id="taskList" style="list-style: none; padding: 0;"></ul>
    </div>
  </div>

  <!-- ==================== زر Gemini العائم والنافذة المنبثقة ==================== -->
  
  <!-- الزر الدائري العائم -->
  <div onclick="openAiModal()" style="position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: linear-gradient(135deg, #4285f4, #9b51e0); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 1000;">
    <!-- أيقونة Gemini -->
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" fill="white"/>
    </svg>
  </div>

  <!-- النافذة المنبثقة للذكاء الاصطناعي -->
  <div id="aiModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1001; align-items: center; justify-content: center;">
    <div style="background: #1e1e2d; border-radius: 15px; width: 90%; max-width: 450px; padding: 20px; color: white; position: relative; box-shadow: 0 5px 25px rgba(0,0,0,0.5); max-height: 85vh; overflow-y: auto;">
      
      <!-- زر إغلاق النافذة -->
      <span onclick="closeAiModal()" style="position: absolute; top: 15px; left: 20px; font-size: 22px; cursor: pointer; color: #aaa;">&times;</span>

      <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">
        ✨ مقترح الخطة الدراسية (Gemini)
      </h3>
      <p style="font-size: 13px; color: #ccc;">أدخل تفاصيل مادتك وسيقوم الذكاء الاصطناعي بإنشاء جدول دراسي مخصص لك:</p>

      <label style="font-size: 13px;">اسم المادة:</label>
      <input type="text" id="aiSubject" placeholder="مثلاً: رياضيات، فرنسي..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a3c; color: white; margin: 5px 0 15px 0; box-sizing: border-box;">

      <label style="font-size: 13px;">عدد الساعات المتاحة يومياً:</label>
      <input type="number" id="aiHours" placeholder="مثلاً: 3" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a3c; color: white; margin: 5px 0 15px 0; box-sizing: border-box;">

      <button onclick="generateAIPlan()" style="width: 100%; background: linear-gradient(135deg, #4285f4, #9b51e0); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px;">
        توليد الخطة الدراسية 🚀
      </button>

      <div id="aiResult" style="margin-top: 15px; white-space: pre-line; background: #2a2a3c; padding: 12px; border-radius: 8px; display: none; border-right: 4px solid #4285f4; font-size: 14px; line-height: 1.6;"></div>
    </div>
  </div>

  <!-- ==================== البرمجة الخاصة بالوظائف ==================== -->
  <script>
    let currentUser = "";
    let tasks = [];

    // تسجيل الدخول وتحميل البيانات من Firestore
    async function loginUser() {
      const user = document.getElementById('usernameInput').value.trim();
      if (!user) {
        alert("يرجى إدخال اسم المستخدم!");
        return;
      }
      currentUser = user;
      document.getElementById('userStatus').innerText = "⏳ جاري تحميل بيانات الحساب: " + currentUser;

      try {
        const docRef = window.doc(window.db, "users", currentUser);
        const docSnap = await window.getDoc(docRef);

        if (docSnap.exists()) {
          tasks = docSnap.data().tasks || [];
          document.getElementById('userStatus').innerText = "✅ مرحباً بك! تم إيجاد بياناتك وتحميلها.";
        } else {
          tasks = [];
          document.getElementById('userStatus').innerText = "🆕 حساب جديد، تم إنشاؤه بنجاح.";
        }
        renderTasks();
      } catch (e) {
        console.error(e);
        document.getElementById('userStatus').innerText = "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات.";
      }
    }

    // إضافة مهمة وحفظها سحابياً
    async function addTask() {
      if (!currentUser) {
        alert("يرجى تسجيل الدخول باسم المستخدم أولاً!");
        return;
      }
      const subject = document.getElementById('taskSubject').value;
      const date = document.getElementById('taskDate').value;

      if (!subject || !date) {
        alert("يرجى تعبئة جميع الحقول!");
        return;
      }

      tasks.push({ subject, date });
      renderTasks();

      // حفظ في السحابة
      try {
        await window.setDoc(window.doc(window.db, "users", currentUser), { tasks: tasks });
      } catch (e) {
        console.error("خطأ في الحفظ السحابي:", e);
      }

      document.getElementById('taskSubject').value = "";
      document.getElementById('taskDate').value = "";
    }

    // عرض القائمة
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = "";
      tasks.forEach((t, index) => {
        list.innerHTML += `<li style="background: #2a2a3c; padding: 10px; margin-bottom: 8px; border-radius: 5px;">
          📌 <strong>${t.subject}</strong> - التاريخ: ${t.date}
        </li>`;
      });
    }

    // فتح وإغلاق نافذة Gemini
    function openAiModal() {
      document.getElementById('aiModal').style.display = 'flex';
    }

    function closeAiModal() {
      document.getElementById('aiModal').style.display = 'none';
    }

    // طلب الخطة من Gemini API
    async function generateAIPlan() {
      const subject = document.getElementById('aiSubject').value;
      const hours = document.getElementById('aiHours').value;
      const resultDiv = document.getElementById('aiResult');

      if (!subject || !hours) {
        alert("يرجى كتابة المادة وعدد الساعات!");
        return;
      }

      resultDiv.style.display = "block";
      resultDiv.innerHTML = "⏳ جاري تحضير خطتك الدراسية بواسطة Gemini...";

      const apiKey = "YOUR_GEMINI_API_KEY"; // 🔴 ضع مفتاحك المجاني من Google AI Studio هنا
      const prompt = `اعمل لي خطة دراسية منظمة ومقسمة لمادة ${subject}، أستطيع دراسة ${hours} ساعات يومياً. حدد لي الأهداف والمهام اليومية بشكل مختصر وواضح في نقاط.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;

        resultDiv.innerHTML = "<strong>📋 الخطة المقترحة:</strong><br><br>" + aiResponse;

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "❌ حدث خطأ، تأكد من صحة المفتاح والاتصال بالإنترنت.";
      }
    }
  </script>
</body>
</html>
