<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم وقت الدراسة</title>

  <!-- استدعاء مكتبات Firebase السحابية -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // مفاتيح مشروعك الخاصة بـ Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyC7biYFwpFo04asez0TOgPXtgghvF87",
      authDomain: "study-planner-87613.firebaseapp.com",
      projectId: "study-planner-87613",
      storageBucket: "study-planner-87613.firebasestorage.app",
      messagingSenderId: "398426757170",
      appId: "1:398426757170:web:3cfeec488e4f7020f1c42b",
      measurementId: "G-NNZ0X983LS"
    };

    // تهيئة تطبيق Firebase وخدمة قاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // جعل الدوال والسجلات متاحة في النافذة العامة (Global Scope)
    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
  </script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 15px;
      direction: rtl;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .btn-red {
      background-color: #e53935;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .btn-blue {
      background-color: #1e88e5;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .day-name {
      font-size: 12px;
      color: #888;
      padding-bottom: 5px;
    }
    .day-cell {
      background-color: #2a2a2a;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .day-cell.active {
      border: 2px solid #1e88e5;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background-color: #2a2a2a;
      border: 1px solid #333;
      color: white;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .timer-display {
      font-size: 28px;
      font-weight: bold;
      color: #e53935;
      text-align: center;
      margin: 15px 0;
      font-family: monospace;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn-group button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background-color: #43a047; }
    .btn-orange { background-color: #fb8c00; }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <div class="header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span>👋 أهلاً Aaam</span>
    </div>
    <button class="btn-red" onclick="loginUser()">تسجيل الدخول</button>
  </div>

  <!-- روزنامة الدراسة -->
  <div class="card">
    <div class="calendar-header">
      <button class="btn-blue">التالي ◀</button>
      <h3 style="margin: 0; font-size: 16px;">📅 روزنامة الدراسة<br><span style="font-size: 12px; font-weight: normal; color: #aaa;">أيلول 2026</span></h3>
      <button class="btn-blue">▶ السابق</button>
    </div>

    <div class="calendar-grid">
      <div class="day-name">السبت</div>
      <div class="day-name">الجمعة</div>
      <div class="day-name">الخميس</div>
      <div class="day-name">الأربعاء</div>
      <div class="day-name">الثلاثاء</div>
      <div class="day-name">الإثنين</div>
      <div class="day-name">الأحد</div>

      <div class="day-cell">5</div><div class="day-cell">4</div><div class="day-cell">3</div><div class="day-cell">2</div><div class="day-cell">1</div><div class="day-cell"></div><div class="day-cell"></div>
      <div class="day-cell">12</div><div class="day-cell">11</div><div class="day-cell">10</div><div class="day-cell">9</div><div class="day-cell">8</div><div class="day-cell">7</div><div class="day-cell">6</div>
      <div class="day-cell">19</div><div class="day-cell">18</div><div class="day-cell">17</div><div class="day-cell">16</div><div class="day-cell">15</div><div class="day-cell">14</div><div class="day-cell">13</div>
      <div class="day-cell">26</div><div class="day-cell">25</div><div class="day-cell">24</div><div class="day-cell">23</div><div class="day-cell">22</div><div class="day-cell">21</div><div class="day-cell">20</div>
      <div class="day-cell"></div><div class="day-cell"></div><div class="day-cell"></div><div class="day-cell"></div><div class="day-cell"></div><div class="day-cell">29</div><div class="day-cell active">28</div>
    </div>
    <p style="text-align: center; font-size: 11px; color: #777; margin-top: 10px;">اضغط على أي يوم لإضافة شيء</p>
  </div>

  <!-- إضافة مهمة دراسية -->
  <div class="card">
    <h3 style="margin-top: 0; font-size: 15px;">➕ إضافة مهمة دراسية</h3>
    <input type="text" id="taskSubject" placeholder="المادة أو المهمة">
    <input type="date" id="taskDate">
    <button class="btn-blue" style="width: 100%; padding: 10px;" onclick="addTask()">إضافة المهمة</button>
  </div>

  <!-- المؤقت -->
  <div class="card">
    <h3 style="margin-top: 0; font-size: 15px; text-align: center;">⏱️ المؤقت</h3>
    <div class="timer-display">00:00:00</div>
    <div class="btn-group">
      <button class="btn-red">إعادة ضبط</button>
      <button class="btn-green">إعادة تشغيل</button>
      <button class="btn-orange">إيقاف مؤقت</button>
    </div>
  </div>

  <!-- مهام الدراسة -->
  <div class="card">
    <h3 style="margin-top: 0; font-size: 15px;">📝 مهام الدراسة</h3>
    <ul id="taskList" style="list-style: none; padding: 0; margin: 0;"></ul>
  </div>


  <!-- ==================== زر الذكاء الاصطناعي (Gemini) ==================== -->
  <div onclick="openAiModal()" style="position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: linear-gradient(135deg, #4285f4, #9b51e0); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" fill="white"/>
    </svg>
  </div>

  <!-- نافذة Gemini المنبثقة -->
  <div id="aiModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1001; align-items: center; justify-content: center;">
    <div style="background: #1e1e1e; border-radius: 12px; width: 90%; max-width: 400px; padding: 20px; color: white; position: relative; border: 1px solid #333;">
      <span onclick="closeAiModal()" style="position: absolute; top: 12px; left: 18px; font-size: 22px; cursor: pointer; color: #888;">&times;</span>
      <h3 style="margin-top: 0;">✨ خطط الدراسة الذكية (Gemini)</h3>
      
      <label style="font-size: 12px; color: #aaa;">المادة:</label>
      <input type="text" id="aiSubject" placeholder="مثال: رياضيات، علوم..." style="margin-top: 4px;">
      
      <label style="font-size: 12px; color: #aaa;">عدد الساعات اليومية:</label>
      <input type="number" id="aiHours" placeholder="مثال: 2" style="margin-top: 4px;">

      <button onclick="generateAIPlan()" class="btn-blue" style="width: 100%; padding: 10px; margin-top: 5px; background: linear-gradient(135deg, #4285f4, #9b51e0); border: none;">توليد الخطة 🚀</button>
      
      <div id="aiResult" style="margin-top: 15px; white-space: pre-line; background: #2a2a2a; padding: 10px; border-radius: 6px; display: none; font-size: 13px; max-height: 200px; overflow-y: auto;"></div>
    </div>
  </div>


  <!-- ==================== السكربت والربط ==================== -->
  <script>
    let currentUser = "Aaam";
    let tasks = [];

    async function loginUser() {
      const user = prompt("أدخل اسم المستخدم الخاص بك:", currentUser);
      if (user) {
        currentUser = user;
        alert("أهلاً بك " + currentUser);
        loadTasks();
      }
    }

    async function loadTasks() {
      try {
        const docRef = window.doc(window.db, "users", currentUser);
        const docSnap = await window.getDoc(docRef);
        if (docSnap.exists()) {
          tasks = docSnap.data().tasks || [];
          renderTasks();
        }
      } catch (e) {
        console.error("خطأ في التحميل:", e);
      }
    }

    async function addTask() {
      const subject = document.getElementById('taskSubject').value;
      const date = document.getElementById('taskDate').value;
      if (!subject || !date) {
        alert("يرجى تعبئة المادة والتاريخ!");
        return;
      }
      tasks.push({ subject, date });
      renderTasks();

      try {
        await window.setDoc(window.doc(window.db, "users", currentUser), { tasks: tasks });
      } catch (e) {
        console.error("خطأ في الحفظ:", e);
      }

      document.getElementById('taskSubject').value = "";
      document.getElementById('taskDate').value = "";
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = "";
      tasks.forEach(t => {
        list.innerHTML += `<li style="background: #2a2a2a; padding: 8px; margin-bottom: 5px; border-radius: 6px; font-size: 13px;">
          📌 ${t.subject} - <span style="color:#888;">${t.date}</span>
        </li>`;
      });
    }

    function openAiModal() { document.getElementById('aiModal').style.display = 'flex'; }
    function closeAiModal() { document.getElementById('aiModal').style.display = 'none'; }

    // دالة توليد الخطة بالذكاء الاصطناعي (المعدلة والسريعة)
    async function generateAIPlan() {
      const subject = document.getElementById('aiSubject').value;
      const hours = document.getElementById('aiHours').value;
      const resultDiv = document.getElementById('aiResult');

      if (!subject || !hours) {
        alert("يرجى تعبئة المادة وعدد الساعات!");
        return;
      }

      resultDiv.style.display = "block";
      resultDiv.innerHTML = "⚡ جاري تحضير خطة سريعة...";

      const apiKey = AQ.Ab8RN6ImN8a7B2atqsS4SChzwRNgkF2aJYS39eWMK8hQvOai9g; // 🔴 ضع مفتاحك المجاني من Google AI Studio هنا
      const prompt = `اكتب خطة دراسية مختصرة جداً ومباشرة في نقاط لمادة ${subject}، المتاحة ${hours} ساعات يومياً.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;
        resultDiv.innerHTML = "<strong>📋 الخطة المقترحة:</strong><br><br>" + aiResponse;
      } catch (error) {
        resultDiv.innerHTML = "❌ حدث خطأ، تأكد من صحة المفتاح والاتصال بالإنترنت.";
      }
    }

    // تحميل المهام فور فتح الصفحة
    window.onload = loadTasks;
  </script>

</body>
</html>
