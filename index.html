<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم وقت الدراسة</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      color: #172554;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 18px #0002;
    }

    h1,
    h2 {
      text-align: center;
    }

    h1 {
      color: #2563eb;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
    }

    input,
    select {
      border: 1px solid #aaa;
    }

    button {
      border: none;
      margin-top: 12px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout,
    .delete,
    .reset {
      background: #dc2626;
    }

    .pause {
      background: #f59e0b;
    }

    .resume {
      background: #16a34a;
    }

    .task {
      border: 1px solid #dbeafe;
      background: #f8fafc;
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
    }

    .task.done {
      opacity: 0.6;
      text-decoration: line-through;
    }

    .task-title {
      font-weight: bold;
      font-size: 18px;
    }

    .task-info {
      color: #475569;
      margin-top: 7px;
      line-height: 1.8;
    }

    .task-buttons {
      display: flex;
      gap: 8px;
    }

    .task-buttons button {
      flex: 1;
    }

    .start {
      background: #2563eb;
    }

    .finish {
      background: #7c3aed;
    }

    .timer {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #dc2626;
      margin: 18px;
      direction: ltr;
    }

    .timer-buttons {
      display: flex;
      gap: 10px;
    }

    .timer-buttons button {
      flex: 1;
    }

    .empty {
      text-align: center;
      color: #64748b;
    }

    .welcome {
      text-align: center;
      color: #2563eb;
      font-size: 20px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin: 25px 0;
      padding: 15px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .task-buttons,
      .timer-buttons {
        flex-direction: column;
      }

      .timer {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- تسجيل الدخول -->
    <div class="card" id="loginBox">
      <h1>📚 منظم وقت الدراسة</h1>

      <p style="text-align:center">
        اكتب اسم مستخدم غير حقيقي للبدء
      </p>

      <input
        id="usernameInput"
        placeholder="مثلاً: Ahmad123"
      >

      <button onclick="login()">دخول</button>
    </div>

    <!-- التطبيق -->
    <div id="app" style="display:none;">

      <div class="card">
        <div class="welcome" id="welcomeText"></div>

        <button class="logout" onclick="logout()">
          تسجيل الخروج
        </button>
      </div>

      <!-- إضافة مهمة -->
      <div class="card">
        <h2>➕ إضافة مهمة دراسية</h2>

        <label>اسم المادة أو المهمة</label>

        <input
          id="taskName"
          placeholder="مثلاً: رياضيات - حل الواجب"
        >

        <label>نوع المهمة</label>

        <select id="taskType">
          <option>مذاكرة</option>
          <option>واجب</option>
          <option>مراجعة</option>
          <option>اختبار</option>
          <option>قراءة</option>
        </select>

        <label>عدد الساعات</label>

        <input
          id="taskHours"
          type="number"
          min="0"
          value="0"
        >

        <label>عدد الدقائق</label>

        <input
          id="taskMinutes"
          type="number"
          min="0"
          max="59"
          value="0"
        >

        <button onclick="addTask()">
          إضافة المهمة
        </button>
      </div>

      <!-- المؤقت -->
      <div class="card">
        <h2>⏱️ المؤقت</h2>

        <div class="timer" id="timer">
          00:00:00
        </div>

        <div class="timer-buttons">
          <button class="pause" onclick="pauseTimer()">
            ⏸️ إيقاف مؤقت
          </button>

          <button class="resume" onclick="resumeTimer()">
            ▶️ إعادة تشغيل
          </button>

          <button class="reset" onclick="resetTimer()">
            🔄 إعادة ضبط
          </button>
        </div>
      </div>

      <!-- المهام -->
      <div class="card">
        <h2>📝 مهامي الدراسية</h2>

        <div id="tasks">
          <p class="empty">
            لم تضف أي مهام حتى الآن
          </p>
        </div>
      </div>

    </div>

    <footer>
      Developed by Ammar Al-Haddar
    </footer>

  </div>

  <script>
    let username = "";
    let tasks = [];

    let timerInterval = null;
    let remainingSeconds = 0;
    let timerRunning = false;
    let currentTaskIndex = null;

    // تشغيل الموقع
    window.onload = function () {
      const savedUsername =
        localStorage.getItem("studyUsername");

      if (savedUsername) {
        username = savedUsername;
        openApp();
      }
    };

    // تسجيل الدخول
    function login() {
      const input =
        document.getElementById("usernameInput");

      const name = input.value.trim();

      if (!name) {
        alert("اكتب اسم مستخدم أولاً");
        return;
      }

      username = name;

      localStorage.setItem(
        "studyUsername",
        username
      );

      openApp();
    }

    // فتح التطبيق
    function openApp() {
      document.getElementById("loginBox")
        .style.display = "none";

      document.getElementById("app")
        .style.display = "block";

      document.getElementById("welcomeText")
        .textContent = "أهلًا " + username + " 👋";

      loadTasks();
      showTasks();
    }

    // تسجيل الخروج
    function logout() {
      saveTasks();

      username = "";
      tasks = [];

      clearInterval(timerInterval);

      remainingSeconds = 0;
      timerRunning = false;
      currentTaskIndex = null;

      document.getElementById("timer")
        .textContent = "00:00:00";

      localStorage.removeItem("studyUsername");

      document.getElementById("app")
        .style.display = "none";

      document.getElementById("loginBox")
        .style.display = "block";

      document.getElementById("usernameInput")
        .value = "";

      showTasks();
    }

    // مفتاح التخزين الخاص بالمستخدم
    function getStorageKey() {
      return "studyTasks_" + username;
    }

    // حفظ المهام
    function saveTasks() {
      if (!username) return;

      localStorage.setItem(
        getStorageKey(),
        JSON.stringify(tasks)
      );
    }

    // تحميل المهام
    function loadTasks() {
      tasks = JSON.parse(
        localStorage.getItem(getStorageKey())
      ) || [];
    }

    // إضافة مهمة
    function addTask() {
      const name = document
        .getElementById("taskName")
        .value
        .trim();

      const type = document
        .getElementById("taskType")
        .value;

      const hours = Number(
        document.getElementById("taskHours")
        .value
      );

      const minutes = Number(
        document.getElementById("taskMinutes")
        .value
      );

      if (
        !name ||
        hours < 0 ||
        minutes < 0 ||
        minutes > 59 ||
        (hours === 0 && minutes === 0)
      ) {
        alert("أدخل اسم المهمة ومدة صحيحة");
        return;
      }

      const totalSeconds =
        (hours * 60 * 60) +
        (minutes * 60);

      tasks.push({
        name: name,
        type: type,
        hours: hours,
        minutes: minutes,
        totalSeconds: totalSeconds,
        done: false
      });

      saveTasks();
      showTasks();

      document.getElementById("taskName")
        .value = "";

      document.getElementById("taskHours")
        .value = "0";

      document.getElementById("taskMinutes")
        .value = "0";
    }

    // تحويل المدة إلى نص
    function formatDuration(hours, minutes) {
      if (hours > 0 && minutes > 0) {
        return hours + " ساعة و" + minutes + " دقيقة";
      }

      if (hours > 0) {
        return hours + " ساعة";
      }

      return minutes + " دقيقة";
    }

    // عرض المهام
    function showTasks() {
      const box =
        document.getElementById("tasks");

      if (!box) return;

      if (tasks.length === 0) {
        box.innerHTML = `
          <p class="empty">
            لم تضف أي مهام حتى الآن
          </p>
        `;
        return;
      }

      box.innerHTML = "";

      tasks.forEach(function (task, index) {
        const div =
          document.createElement("div");

        div.className = task.done
          ? "task done"
          : "task";

        div.innerHTML = `
          <div class="task-title">
            ${task.name}
          </div>

          <div class="task-info">
            النوع: ${task.type}
            <br>
            المدة:
            ${formatDuration(task.hours, task.minutes)}
          </div>

          <div class="task-buttons">

            <button
              class="start"
              onclick="startTimer(${index})">
              ▶️ ابدأ المؤقت
            </button>

            <button
              class="finish"
              onclick="finishTask(${index})">
              ✅ ${task.done
                ? "تم الإنجاز"
                : "إنهاء"}
            </button>

            <button
              class="remove"
              onclick="deleteTask(${index})">
              🗑️ حذف
            </button>

          </div>
        `;

        box.appendChild(div);
      });
    }

    // بدء المؤقت من البداية
    function startTimer(index) {
      clearInterval(timerInterval);

      currentTaskIndex = index;

      remainingSeconds =
        tasks[index].totalSeconds;

      timerRunning = true;

      updateTimer();

      timerInterval = setInterval(function () {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateTimer();
        }

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;

          alert(
            "🎉 انتهى وقت المهمة:\n" +
            tasks[index].name
          );

          finishTask(index);
        }
      }, 1000);
    }

    // إيقاف المؤقت مؤقتًا
    function pauseTimer() {
      if (!timerRunning) return;

      clearInterval(timerInterval);
      timerRunning = false;
    }

    // إعادة تشغيل المؤقت من مكان التوقف
    function resumeTimer() {
      if (timerRunning) return;

      if (remainingSeconds <= 0) {
        alert("لا يوجد مؤقت متوقف لإعادة تشغيله");
        return;
      }

      timerRunning = true;

      timerInterval = setInterval(function () {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateTimer();
        }

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;

          if (currentTaskIndex !== null) {
            alert(
              "🎉 انتهى وقت المهمة:\n" +
              tasks[currentTaskIndex].name
            );

            finishTask(currentTaskIndex);
          }
        }
      }, 1000);
    }

    // إعادة المؤقت إلى صفر
    function resetTimer() {
      clearInterval(timerInterval);

      remainingSeconds = 0;
      timerRunning = false;
      currentTaskIndex = null;

      document.getElementById("timer")
        .textContent = "00:00:00";
    }

    // عرض الوقت بالساعات والدقائق والثواني
    function updateTimer() {
      const hours =
        Math.floor(remainingSeconds / 3600);

      const minutes =
        Math.floor((remainingSeconds % 3600) / 60);

      const seconds =
        remainingSeconds % 60;

      document.getElementById("timer")
        .textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    // إنهاء المهمة
    function finishTask(index) {
      tasks[index].done = true;

      saveTasks();
      showTasks();
    }

    // حذف المهمة
    function deleteTask(index) {
      const answer = confirm(
        "هل تريد حذف هذه المهمة؟"
      );

      if (!answer) return;

      tasks.splice(index, 1);

      saveTasks();
      showTasks();
    }
  </script>

</body>
</html>
